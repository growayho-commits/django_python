<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROWAY SOLUTIONS - Marketplace Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 text-white py-4 shadow-md">
        <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider">GROWAY <span class="text-amber-400">MARKETPLACE</span></h1>
            <div id="user-status" class="text-sm text-slate-300 hidden">
                Signed in as: <span id="logged-email" class="font-semibold text-white"></span>
                <button onclick="handleSignOut()" class="ml-4 bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-xs transition">Sign Out</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
            
            <!-- Tabs Header -->
            <div class="flex border-b border-slate-200 bg-slate-50">
                <button onclick="switchTab('signin')" id="tab-signin" class="flex-1 py-4 text-center font-semibold text-slate-900 border-b-2 border-blue-600 transition">Sign In</button>
                <button onclick="switchTab('signup')" id="tab-signup" class="flex-1 py-4 text-center font-semibold text-slate-400 hover:text-slate-700 transition">Sign Up</button>
            </div>

            <div class="p-8">
                <!-- Alert Box -->
                <div id="alert-box" class="hidden mb-6 p-4 rounded-lg text-sm"></div>

                <!-- Sign In Form -->
                <div id="form-signin" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Email Address</label>
                        <input type="email" id="signin-email" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none transition" placeholder="name@example.com">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Password</label>
                        <input type="password" id="signin-password" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none transition" placeholder="••••••••">
                    </div>
                    <button onclick="handleSignIn()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 rounded-lg shadow-md transition duration-200">Login to Account</button>
                </div>

                <!-- Sign Up Form -->
                <div id="form-signup" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Email Address</label>
                        <input type="email" id="signup-email" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none transition" placeholder="name@example.com">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Password</label>
                        <input type="password" id="signup-password" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none transition" placeholder="••••••••">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Role</label>
                        <select id="signup-role" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none bg-white transition">
                            <option value="member">Member</option>
                            <option value="merchant">Merchant</option>
                        </select>
                    </div>
                    <button onclick="handleSignUp()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow-md transition duration-200">Create Account & Send OTP</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400">
        &copy; 2026 GROWAY SOLUTIONS. All rights reserved.
    </footer>

    <!-- JavaScript Integration -->
    <script>
        const API_BASE = '/api/users';

        function switchTab(tab) {
            const signinForm = document.getElementById('form-signin');
            const signupForm = document.getElementById('form-signup');
            const signinTab = document.getElementById('tab-signin');
            const signupTab = document.getElementById('tab-signup');
            
            hideAlert();

            if (tab === 'signin') {
                signinForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                signinTab.className = "flex-1 py-4 text-center font-semibold text-slate-900 border-b-2 border-blue-600 transition";
                signupTab.className = "flex-1 py-4 text-center font-semibold text-slate-400 hover:text-slate-700 transition";
            } else {
                signinForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                signupTab.className = "flex-1 py-4 text-center font-semibold text-slate-900 border-b-2 border-blue-600 transition";
                signinTab.className = "flex-1 py-4 text-center font-semibold text-slate-400 hover:text-slate-700 transition";
            }
        }

        function showAlert(message, isSuccess = true) {
            const alertBox = document.getElementById('alert-box');
            alertBox.className = `mb-6 p-4 rounded-lg text-sm ${isSuccess ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-rose-50 text-rose-800 border border-rose-200'}`;
            alertBox.innerText = message;
            alertBox.classList.remove('hidden');
        }

        function hideAlert() {
            document.getElementById('alert-box').classList.add('hidden');
        }

        async function handleSignUp() {
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const role = document.getElementById('signup-role').value;

            if (!email || !password) {
                showAlert("Please fill in all fields.", false);
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/signup/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role })
                });
                const data = await response.json();

                if (response.ok) {
                    showAlert("Registration successful! OTP sent to your email and superuser.");
                    setTimeout(() => switchTab('signin'), 2000);
                } else {
                    showAlert(JSON.stringify(data), false);
                }
            } catch (error) {
                showAlert("Connection error with backend server.", false);
            }
        }

        async function handleSignIn() {
            const email = document.getElementById('signin-email').value;
            const password = document.getElementById('signin-password').value;

            if (!email || !password) {
                showAlert("Please enter email and password.", false);
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/signin/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('access_token', data.access);
                    localStorage.setItem('refresh_token', data.refresh);
                    
                    document.getElementById('logged-email').innerText = email;
                    document.getElementById('user-status').classList.remove('hidden');
                    showAlert("Login successful!");
                } else {
                    showAlert("Invalid email or password.", false);
                }
            } catch (error) {
                showAlert("Connection error with backend server.", false);
            }
        }

        async function handleSignOut() {
            const refreshToken = localStorage.getItem('refresh_token');
            const accessToken = localStorage.getItem('access_token');

            try {
                await fetch(`${API_BASE}/signout/`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: JSON.stringify({ refresh: refreshToken })
                });
            } catch (e) {
                console.error(e);
            }

            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            document.getElementById('user-status').classList.add('hidden');
            showAlert("Signed out successfully.");
            switchTab('signin');
        }
    </script>
</body>
</html>
