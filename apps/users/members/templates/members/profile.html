<section id="view-profile" class="view-section max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="bg-white border border-slate-200 p-8 rounded-3xl shadow-xl">
        <h2 class="text-2xl font-bold text-slate-900 text-center mb-2">Update Member Profile</h2>
        <form method="POST" onsubmit="event.preventDefault(); alert('Profile updated!');" class="space-y-4 mt-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-amber-600 uppercase mb-1">Registered Email</label>
                <input type="email" value="{{ request.user.email|default:'member@gmail.com' }}" disabled class="w-full bg-slate-100 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-500 text-sm cursor-not-allowed">
            </div>
            <div>
                <label class="block text-xs font-semibold text-amber-600 uppercase mb-1">Operating Pincode</label>
                <input type="text" id="profile-pincode" value="641001" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-900 text-sm">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 font-bold py-3 rounded-xl shadow-lg">Save Profile Changes</button>
        </form>
    </div>
</section>
