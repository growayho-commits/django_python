<section id="view-support" class="view-section max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <h2 class="text-2xl font-bold text-slate-900 mb-6 border-b border-slate-200 pb-3">Helpdesk Tickets, Refunds & Live Support</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm">
            <h3 class="text-lg font-bold text-slate-900 mb-4">Create Support / Refund Ticket</h3>
            <form onsubmit="event.preventDefault(); alert('Ticket Created!');" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-amber-600 uppercase mb-1">Subject</label>
                    <input type="text" placeholder="Enter ticket subject" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm" required>
                </div>
                <button type="submit" class="w-full bg-amber-500 text-slate-950 font-bold py-2.5 rounded-xl shadow">Submit Ticket</button>
            </form>
        </div>
    </div>
</section>
