{% extends 'sellers/dashboard.html' %}
{% block seller_content %}
<div class="bg-white rounded-2xl p-6 shadow-xs border border-slate-200/70">
    <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-4">
        <div>
            <h1 class="text-xl font-bold text-slate-900">Seller Profile</h1>
            <p class="text-sm text-slate-500">Manage seller account, store details, and GST information</p>
        </div>
        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-700">Profile</span>
    </div>
    <div class="space-y-2 text-sm text-slate-700">
        <p><span class="font-semibold">Email:</span> {{ request.user.email|default:"seller@gmail.com" }}</p>
    </div>
</div>
{% endblock %}
