<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLM Network Tree View - HYBRID MARKETPLACE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tree structure styling */
        .tree ul {
            position: relative; padding-top: 20px; transition: all 0.5s;
        }
        .tree li {
            float: left; text-align: center; list-style-type: none;
            position: relative; padding: 20px 5px 0 5px; transition: all 0.5s;
        }
        .tree li::before, .tree li::after {
            content: ''; position: absolute; top: 0; right: 50%;
            border-top: 2px solid #cbd5e1; width: 50%; height: 20px;
        }
        .tree li::after {
            right: auto; left: 50%; border-left: 2px solid #cbd5e1;
        }
        .tree li:only-child::after, .tree li:only-child::before {
            display: none;
        }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after {
            border: 0;
        }
        .tree li:last-child::before {
            border-right: 2px solid #cbd5e1; border-radius: 0 5px 0 0;
        }
        .tree li:first-child::after {
            border-left: 2px solid #cbd5e1; border-radius: 5px 0 0 0;
        }
        .tree ul ul::before {
            content: ''; position: absolute; top: 0; left: 50%;
            border-left: 2px solid #cbd5e1; width: 0; height: 20px;
        }
        .tree li div {
            border: 2px solid #cbd5e1; padding: 10px 15px; text-decoration: none;
            display: inline-block; border-radius: 12px; background: white;
            color: #1e293b; font-family: arial, verdana, sans-serif; font-size: 14px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: all 0.3s;
        }
        .tree li div:hover {
            background: #e0e7ff; border-color: #6366f1; color: #4338ca;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-6">

    <!-- Top Navigation -->
    <div class="max-w-7xl mx-auto mb-8 flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <h1 class="text-xl font-black text-indigo-600 tracking-wider">HYBRID MARKETPLACE - MLM HIERARCHY TREE</h1>
        <a href="{% url 'superusers:dashboard' %}" class="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-slate-200 transition">Back to Dashboard</a>
    </div>

    <!-- Tree Container -->
    <div class="max-w-7xl mx-auto bg-white p-8 rounded-3xl shadow-sm border border-slate-200 overflow-x-auto">
        <h2 class="text-lg font-bold text-slate-800 mb-6 text-center">Network Tree Structure</h2>
        
        <div class="tree flex justify-center">
            <ul>
                {% for user in root_users %}
                    <li>
                        <div>
                            <p class="font-bold text-indigo-600">{{ user.email|default:user.username }}</p>
                            <p class="text-xs text-slate-500">Role: {{ user.role|default:"Member" }}</p>
                        </div>
                        <!-- கீழ்நிலை (Downline) பயனர்களை இங்கே ரெகர்சிவ் (Recursive) முறையில் இணைக்கலாம் -->
                    </li>
                {% empty %}
                    <p class="text-slate-500 text-center py-4">No network users found in the hierarchy.</p>
                {% endfor %}
            </ul>
        </div>
    </div>

</body>
</html>
