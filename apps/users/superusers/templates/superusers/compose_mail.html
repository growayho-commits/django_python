<form method="POST" enctype="multipart/form-data" class="space-y-4 bg-slate-900 p-6 rounded-2xl border border-slate-800">
    {% csrf_token %}
    <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Recipient Email</label>
        <input type="email" name="recipient_email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-white">
    </div>
    <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Subject</label>
        <input type="text" name="subject" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-white">
    </div>
    <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Message Body</label>
        <textarea name="body" rows="4" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-white"></textarea>
    </div>
    <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Attachment (Documents/Images)</label>
        <input type="file" name="attachment" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400">
    </div>
    <button type="submit" class="w-full bg-amber-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition hover:bg-amber-400">Send Internal Mail</button>
</form>
