<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Role Requirement - HYBRID MARKETPLACE</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { width: 260px; min-height: 100vh; background-color: #343a40; color: #fff; position: fixed; }
        .sidebar .nav-link { color: #adb5bd; padding: 12px 20px; font-weight: 500; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background-color: #0d6efd; border-radius: 4px; }
        .main-content { margin-left: 260px; padding: 20px; }
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: relative; min-height: auto; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar p-3 d-flex flex-column justify-content-between">
        <div>
            <div class="d-flex align-items-center mb-4 px-2">
                <i class="bi bi-shield-lock-fill fs-3 text-primary me-2"></i>
                <h5 class="m-0 fw-bold">Superuser Admin</h5>
            </div>
            <hr class="text-secondary">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item mb-1">
                    <a href="{% url 'superuser_dashboard' %}" class="nav-link"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                </li>
                <li class="nav-item mb-1">
                    <a href="{% url 'superuser_dashboard' %}#pending-requests" class="nav-link"><i class="bi bi-people-fill me-2"></i> User Requests</a>
                </li>
                <li class="nav-item mb-1">
                    <a href="{% url 'superuser_dashboard' %}#role-requirements" class="nav-link active"><i class="bi bi-gear-fill me-2"></i> Role Requirements</a>
                </li>
            </ul>
        </div>
        <div class="text-center text-muted small">
            <p class="mb-0">HYBRID MARKETPLACE v1.0</p>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4 px-4 rounded">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h5 fw-bold text-secondary">Configure Role Settings</span>
                <div class="d-flex align-items-center">
                    <span class="fw-bold text-dark me-3"><i class="bi bi-person-circle fs-5"></i> Administrator</span>
                </div>
            </div>
        </nav>

        <!-- Edit Form Card -->
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-pencil-square me-2 text-primary"></i> Edit Role Requirement Configuration</h5>
                    </div>
                    <div class="card-body p-4">
                        <form method="POST">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                {{ form.as_p }}
                            </div>

                            <div class="d-flex gap-2 justify-content-end mt-4">
                                <a href="{% url 'superuser_dashboard' %}" class="btn btn-light border px-4">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-1"></i> Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
