<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FAQs List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2 class="mb-4">Frequently Asked Questions (FAQs)</h2>
    
    <a href="{% url 'faq_add' %}" class="btn btn-primary mb-3">Add New FAQ</a>

    <div class="list-group">
        {% for faq in faqs %}
            <div class="list-group-item list-group-item-action mb-2">
                <h5 class="mb-1">{{ faq.question }}</h5>
                <p class="mb-1">{{ faq.answer }}</p>
                <small class="text-muted">Status: {% if faq.is_active %}Active{% else %}Inactive{% endif %}</small>
            </div>
        {% empty %}
            <p class="text-muted">No FAQs found.</p>
        {% endfor %}
    </div>
</body>
</html>
