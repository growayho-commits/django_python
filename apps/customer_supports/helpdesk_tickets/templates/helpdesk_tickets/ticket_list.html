<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helpdesk Tickets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2 class="mb-4">My Helpdesk Tickets</h2>
    
    <a href="{% url 'ticket_create' %}" class="btn btn-primary mb-3">Create New Ticket</a>

    <div class="list-group">
        {% for ticket in tickets %}
            <div class="list-group-item list-group-item-action mb-2">
                <div class="d-flex w-100 justify-content-between">
                    <h5 class="mb-1">{{ ticket.subject }}</h5>
                    <small>Status: {{ ticket.status }}</small>
                </div>
                <p class="mb-1">{{ ticket.description }}</p>
                <small class="text-muted">Priority: {{ ticket.priority }}</small>
            </div>
        {% empty %}
            <p class="text-muted">No support tickets found.</p>
        {% endfor %}
    </div>
</body>
</html>
