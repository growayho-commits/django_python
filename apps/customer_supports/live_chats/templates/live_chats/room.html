<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Chat Room</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4>Chat Room: {{ room_name }}</h4>
        </div>
        <div class="card-body" style="height: 300px; overflow-y: scroll;" id="chat-log">
            <p class="text-muted">Connected to support chat room...</p>
        </div>
        <div class="card-footer">
            <div class="input-group">
                <input type="text" id="chat-message-input" class="form-control" placeholder="Type a message...">
                <button class="btn btn-primary" id="chat-message-submit" type="button">Send</button>
            </div>
        </div>
    </div>
</body>
</html>
