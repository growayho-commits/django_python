<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Returns & Refunds</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2 class="mb-4">Return & Refund Requests</h2>
    
    <a href="{% url 'refund_request' %}" class="btn btn-primary mb-3">Request Return/Refund</a>

    <div class="list-group">
        {% for refund in refunds %}
            <div class="list-group-item list-group-item-action mb-2">
                <div class="d-flex w-100 justify-content-between">
                    <h5 class="mb-1">Order: {{ refund.order }}</h5>
                    <small>Amount: ${{ refund.refund_amount }}</small>
                </div>
                <p class="mb-1">Reason: {{ refund.reason }}</p>
                <small class="text-muted">{{ refund.description }}</small>
            </div>
        {% empty %}
            <p class="text-muted">No return/refund requests found.</p>
        {% endfor %}
    </div>
</body>
</html>
